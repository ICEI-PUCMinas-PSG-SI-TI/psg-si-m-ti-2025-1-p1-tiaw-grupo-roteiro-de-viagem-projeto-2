<script>
function sairConta() {
  // Verificar se existe um usuário logado
  const usuario = sessionStorage.getItem("usuarioCorrente");

  if (!usuario) {
    alert("Nenhum usuário está logado no momento.");
    return;
  }

  // Limpar o sessionStorage e variáveis
  sessionStorage.removeItem("usuarioCorrente");
  usuarioCorrente = null;

  // Limpar campos se existirem
  if (document.getElementById("login")) document.getElementById("login").value = "";
  if (document.getElementById("nomecompleto")) document.getElementById("nomecompleto").value = "";
  if (document.getElementById("email")) document.getElementById("email").value = "";
  if (document.getElementById("senha")) document.getElementById("senha").value = "";

  // Limpar textos e imagens do perfil, se existirem
  if (document.getElementById("nome-usuario")) document.getElementById("nome-usuario").textContent = "";
  if (document.getElementById("usuario-nome-topo")) document.getElementById("usuario-nome-topo").textContent = "";
  if (document.getElementById("avatar")) document.getElementById("avatar").src = "assets/img/imglogin.png";
  if (document.getElementById("avatar-topo")) document.getElementById("avatar-topo").src = "assets/img/imglogin.png";

  alert("Você saiu da conta.");
  window.location.href = "index.html";
}

function toggleMenu() {
  const menu = document.getElementById('sideMenu');
  menu.classList.toggle('open');
}

document.getElementById('darkModeToggle')?.addEventListener('change', function () {
  document.body.classList.toggle('dark-mode', this.checked);
});

const botaoSair = document.getElementById("sair_conta");
if (botaoSair) {
  botaoSair.addEventListener("click", sairConta);
}
</script>

    <div class="titulo">
        <div class="d-flex justify-content-center mt-5">
            <h4>RECOMENDAÇÕES</h4>
        </div>
    </div>

    <main>
        <div id="botoes" class="container-fluid">
            <button id="button_voltar" class="btn btn-primary">VOLTAR</button>
            <button id="button_cad" class="btn btn-primary">RECOMENDAR</button>
        </div>

        <div class="container">
            <div class="titulo2" style="display: flex; justify-content: center; gap: 9px; margin-top: 1%;">
                <h4 class="text-center" style="margin-top: 1%;">RECOMENDAÇÕES ENVIADAS PARA</h4>
                <h4 class="text-center" style="margin-top: 1%; background-color: #F48613; padding-left: 0.5%; padding-right: 0.5%; border-radius: 5px;">SMART TRAVEL</h4>
            </div>
        </div>

        <div id="infor" class="container text-center py-4 d-flex flex-column align-items-center">
            <div class="recomendacao w-100 mb-4 p-3" style="border-bottom: 2px solid #ccc;">
                <p class="data mb-2" style="font-size: 18px;"></p>
                <p class="tipo mb-2" style="font-size: 26px;"><strong></strong></p>
                <p class="nome mb-2"></p>
                <div class="row justify-content-center w-100">
                    <div class="col-12 col-md-4 mb-2">
                        <p class="estado mb-0"></p>
                    </div>
                    <div class="col-12 col-md-4 mb-2">
                        <p class="cidade mb-0"></p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer>
        <div class="d-flex">
            <div class="rodape">
                <i class="fa-solid fa-copyright"></i>
                <p style="margin: 0;">Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>
    
    <script>

      document.getElementById("button_voltar").addEventListener("click", function () {
            window.location.href = "index.html";
        });
        document.getElementById("button_cad").addEventListener("click", function () {
            window.location.href = "cadastro_hosp.html";
        });

const url = "http://localhost:3000/recomendacoes";

// Pega o usuário logado do sessionStorage
const dadosUsuario = sessionStorage.getItem("usuarioCorrente");
const usuario = JSON.parse(dadosUsuario);
const nome_login = usuario.login.trim().toLowerCase(); // Ex: "martas"

// Função para normalizar nomes
function normalizarNome(nome) {
  return nome.replace(/\s|\./g, "").trim().toLowerCase(); // remove espaços e pontos, e coloca tudo em minúsculas
}

fetch(url)
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById("infor");
    const modelo = container.querySelector(".recomendacao");

    // Limpa o container
    container.innerHTML = "";

    if (data.length > 0) {
      // Filtra recomendações do usuário logado
      const recomendacoesUsuario = data.filter(rec =>
        normalizarNome(rec.usuario) === nome_login
      );

      if (recomendacoesUsuario.length > 0) {
        // Ordena por data decrescente
        recomendacoesUsuario.sort((a, b) => new Date(b.data_solicitacao) - new Date(a.data_solicitacao));

        recomendacoesUsuario.forEach(rec => {
          const clone = modelo.cloneNode(true);

          clone.querySelector(".data").textContent = rec.data_solicitacao;
          clone.querySelector(".tipo").textContent = rec.hosp_rest_pass;
          clone.querySelector(".nome").textContent = rec.nome_local;
          clone.querySelector(".estado").textContent = rec.nome_estado;
          clone.querySelector(".cidade").textContent = rec.nome_cidade;

          container.appendChild(clone);
        });
      } else {
        const mensagem = document.createElement("p");
        mensagem.textContent = "NENHUMA RECOMENDAÇÃO FEITA POR ESTE USUÁRIO.";
        container.appendChild(mensagem);
      }
    } else {
      const mensagem = document.createElement("p");
      mensagem.textContent = "NÃO HÁ RECOMENDAÇÕES.";
      container.appendChild(mensagem);
    }
  })
  .catch(error => {
    console.error("Erro ao buscar recomendações:", error);
    const container = document.getElementById("infor");
    container.innerHTML = "<p>ERRO AO CARREGAR DADOS</p>";
  });


    </script>

    <script src="assets/scripts/usuario.js"></script>

</body>
