<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTravel</title>
    <link rel="stylesheet" href="cadastros_recomen.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>

    <header class="d-flex cab position-relative cab container-fluid">
        <img src="./Imagens/logo1.png" id="logo">
        <p class="position-absolute" id="iconworld">BRL <i class="fa-solid fa-earth-americas"></i></p>
        <p class="position-absolute py-1 px-3" id="nomelogin"><strong>MARTA</strong></p>
        <i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i>
    </header>

    <div class="titulo">
        <div class="d-flex justify-content-center mt-5">
            <h4>RECOMENDAÇÕES</h4>
        </div>
    </div>

    <main>
        <div id="botoes" class="container-fluid">
            <button id="button_voltar" class="btn btn-primary">VOLTAR</button>
            <button id="button_cad" class="btn btn-primary">RECOMENDAR</button>
        </div>

        <div class="container">
            <div class="titulo2" style="display: flex; justify-content: center; gap: 9px; margin-top: 1%;">
                <h4 class="text-center" style="margin-top: 1%;">RECOMENDAÇÕES ENVIADAS PARA</h4>
                <h4 class="text-center" style="margin-top: 1%; background-color: #F48613; padding-left: 0.5%; padding-right: 0.5%; border-radius: 5px;">SMART TRAVEL</h4>
            </div>
        </div>

        <p class="mb-2" style="margin-left: 30%; margin-top: 2%; font-size: 18px;" id="data"></p>
        <div class="container text-center py-4 d-flex flex-column align-items-center" id="infor">
            <p class="mb-2" style="margin-top: -2.5%;" id="tipo"></p>
            <p class="mb-2" style="margin-top: 1%;" id="nome">NÃO HÁ RECOMENDAÇÕES</p>

            <div class="row justify-content-center w-100" style="margin-bottom: 5%;">
                <div class="col-12 col-md-4 mb-2">
                    <p class="mb-0" style="margin-top: 0.5%;" id="estado"></p>
                </div>
                <div class="col-12 col-md-4 mb-2">
                    <p class="mb-0" style="margin-top: 0.5%;" id="cidade"></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="d-flex">
            <div class="rodape">
                <i class="fa-solid fa-copyright"></i>
                <p style="margin: 0;">Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>
    
    <script>
        document.getElementById("button_cad").addEventListener("click", function () {
            window.location.href = "cadastro_hosp.html";
        });
        document.getElementById("button_voltar").addEventListener("click", function () {
            window.location.href = "cadastro_hosp.html";
        });

    </script>

</body>
</html>
