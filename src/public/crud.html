<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Smart Travel - Criar Roteiro</title>
  <style>
    body { font-family: Arial,sans-serif; margin:0; background:#f9f9f9; }
    header { background:#ff7f00; display:flex; align-items:center; justify-content:space-between; padding:10px 20px; color:white; }
    header img.logo { height:40px; }
    header .perfil { display:flex; align-items:center; }
    header .perfil span { margin-right:10px; }
    main { padding:20px; max-width:1000px; margin:auto; }
    h2 { text-align:center; margin-bottom:20px; }
    form { background:#fff; padding:20px; border-radius:10px; display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-bottom:30px; }
    label { font-weight:bold; margin-bottom:5px; display:block; }
    input, select { width:100%; padding:8px; border:1px solid #ccc; border-radius:5px; }
    .checkbox-group { display:flex; gap:10px; flex-wrap:wrap; }
    button { grid-column:span 2; padding:10px; background:#007bff; color:white; border:none; border-radius:8px; cursor:pointer; }
    button:hover { background:#0056b3; }
    #listaRoteiros { list-style:none; padding:0; }
    #listaRoteiros li { background:white; margin-bottom:10px; padding:10px; border-radius:5px; display:flex; justify-content:space-between; align-items:center; }
    #listaRoteiros li span { flex:1; }
    .acao { margin-left:5px; padding:5px 10px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; }
    .acao:hover { background:#0056b3; }
  </style>
</head>
<body>
  <header>
    <img src="https://via.placeholder.com/100x40?text=Smart+Travel" alt="Logo" class="logo" />
    <div class="perfil">
      <span>MARTA</span>
      <img src="https://via.placeholder.com/40" alt="Usuário" style="border-radius:50%;" />
    </div>
  </header>
  <main>
    <h2>CRIE OU EDITE SEU ROTEIRO</h2>
    <form id="roteiroForm">
      <input type="hidden" name="id" />
      <div>
        <label>Data Ida:</label>
        <input type="date" name="ida" required />
      </div>
      <div>
        <label>Data Volta:</label>
        <input type="date" name="volta" required />
      </div>
      <div>
        <label>Pessoas:</label>
        <input type="number" name="pessoas" min="1" required />
      </div>
      <div>
        <label>Gasto Estimado (R$):</label>
        <input type="number" name="orcamento" min="0" required />
      </div>
      <div>
        <label>Estado:</label>
        <select name="estado" required>
          <option value="">SELECIONE</option>
          <option value="SP">SP</option>
          <option value="RJ">RJ</option>
          <option value="MG">MG</option>
        </select>
      </div>
      <div>
        <label>Cidade:</label>
        <input type="text" name="cidade" required />
      </div>

      <!-- Agora mudamos para RADIO pois só pode ser uma escolha -->
      <div>
        <label>Pet?</label>
        <div class="checkbox-group">
          <label><input type="radio" name="pet" value="sim" required /> Sim</label>
          <label><input type="radio" name="pet" value="nao" /> Não</label>
        </div>
      </div>
      <div>
        <label>Piscina?</label>
        <div class="checkbox-group">
          <label><input type="radio" name="piscina" value="sim" required /> Sim</label>
          <label><input type="radio" name="piscina" value="nao" /> Não</label>
        </div>
      </div>
      <div>
        <label>Quartos:</label>
        <div class="checkbox-group">
          <label><input type="radio" name="quartos" value="1" required /> 1</label>
          <label><input type="radio" name="quartos" value="2-3" /> 2‑3</label>
          <label><input type="radio" name="quartos" value="mais" /> Mais de 4</label>
        </div>
      </div>
      <div>
        <label>Garagem?</label>
        <div class="checkbox-group">
          <label><input type="radio" name="garagem" value="sim" required /> Sim</label>
          <label><input type="radio" name="garagem" value="nao" /> Não</label>
        </div>
      </div>
      <button type="submit">SALVAR ROTEIRO</button>
    </form>

    <h2>MEUS ROTEIROS</h2>
    <ul id="listaRoteiros"></ul>
  </main>

  <script>
    const rota = 'http://localhost:3000/roteiros';
    const form = document.getElementById('roteiroForm');
    const list = document.getElementById('listaRoteiros');

    // Carregar lista de roteiros
    async function loadList() {
      const res = await fetch(rota);
      const arr = await res.json();
      list.innerHTML = arr
        .map(
          (r) => `
          <li>
            <span>${r.cidade}, ${r.estado} — ${r.ida} a ${r.volta}</span>
            <button class="acao" onclick="ver(${r.id})">Ver</button>
            <button class="acao" onclick="edit(${r.id})">Editar</button>
            <button class="acao" onclick="excl(${r.id})">Excluir</button>
          </li>`
        )
        .join('');
    }

    // Botão ver leva para ver.index.html
    window.ver = (id) => {
      location.href = `ver.index.html?id=${id}`;
    };

    // Excluir roteiro da API e atualizar lista
    window.excl = async (id) => {
      if (confirm('Deseja realmente excluir este roteiro?')) {
        const res = await fetch(`${rota}/${id}`, { method: 'DELETE' });
        if (res.ok) {
          alert('Roteiro excluído!');
          loadList();
          form.reset();
        } else {
          alert('Erro ao excluir roteiro.');
        }
      }
    };

    // Editar roteiro: carregar dados no form
    window.edit = async (id) => {
      const res = await fetch(`${rota}/${id}`);
      if (!res.ok) {
        alert('Erro ao carregar roteiro para edição.');
        return;
      }
      const r = await res.json();

      // Preenche form
      form.id.value = r.id;
      form.ida.value = r.ida;
      form.volta.value = r.volta;
      form.pessoas.value = r.pessoas;
      form.orcamento.value = r.orcamento;
      form.estado.value = r.estado;
      form.cidade.value = r.cidade;

      // Para inputs radio: marcar o que corresponde ao valor salvo (que é string)
      ['pet', 'piscina', 'quartos', 'garagem'].forEach((name) => {
        form.querySelectorAll(`input[name="${name}"]`).forEach(input => {
          input.checked = input.value === (Array.isArray(r[name]) ? r[name][0] : r[name]);
        });
      });

      window.scrollTo(0, 0);
    };

    // Envio do formulário - cria ou edita roteiro
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Pega id (se existir) para decidir POST ou PUT
      const id = form.id.value ? Number(form.id.value) : null;

      // Monta objeto com dados do form, convertendo radios para string em array para ficar igual no JSON
      const dados = {
        ida: form.ida.value,
        volta: form.volta.value,
        pessoas: form.pessoas.value,
        orcamento: form.orcamento.value,
        estado: form.estado.value,
        cidade: form.cidade.value,
        pet: [form.pet.value],       // radio, guardo array com 1 item
        piscina: [form.piscina.value],
        quartos: [form.quartos.value],
        garagem: [form.garagem.value]
      };

      try {
        let res;

        if (id) {
          res = await fetch(`${rota}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados),
          });
        } else {
          res = await fetch(rota, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados),
          });
        }

        if (!res.ok) throw new Error('Erro ao salvar roteiro');

        alert(id ? 'Roteiro atualizado com sucesso!' : 'Roteiro criado com sucesso!');
        form.reset();
        loadList();
      } catch (error) {
        alert(error.message);
      }
    });

    // Inicializar
    loadList();
  </script>
</body>
</html>
