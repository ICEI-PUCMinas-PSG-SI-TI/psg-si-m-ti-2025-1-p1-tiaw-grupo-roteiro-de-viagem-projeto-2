    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Favoritos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="assets/css/favoritos.css">
        <link rel="shortcut icon" type="imagex/png" href="assets/img/aviaoeseta.png">
        
    </head>

    <body>
        <header class="d-flex cab position-relative cab container-fluid">

            <a href="index.html"><img src="assets/img/logoST.PNG" id="logo"></a>
            
            <p class="position-absolute py-1 px-3" id="nomelogin">LOGIN</p>
            <a href="PerfilUsuario.html"><i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i></a>

        </header>
        <div id="msgFav"></div>
        <div class="container">
            <div class="row row-cols-1 g-4 row-cols-xxl-4 row-cols-xl-4 row-cols-md-2  row-cols-sm-2 row-cols-xs-1 "
                id="favoritos"></div>
        </div>
        <footer>
            <div class="d-flex align-items-center">
                <div class="rodape">
                    <i class="fa-solid fa-copyright"></i>
                    <p style="margin: 0;">Todos os direitos reservados.</p>
                </div>
            </div>
        </footer>



        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const usuarioCorrente = JSON.parse(sessionStorage.getItem('usuarioCorrente'));
                if (!usuarioCorrente) {
                    alert('Você precisa estar logado para ver os favoritos.');
                    window.location.href = 'login.html';
                    return;
                }

                fetch('http://localhost:3000/roteirosProntos')
                    .then(res => res.json())
                    .then(cidades => {
                        const favoritos = usuarioCorrente.favoritos || [];
                        const cidadesFavoritas = cidades.filter(cidade => favoritos.includes(cidade.id));
                        const container = document.getElementById('favoritos')
                        const divmsg = document.getElementById('msgFav');
                        divmsg.innerHTML = '';

                        if (cidadesFavoritas.length === 0) {
                            divmsg.innerHTML =
                                '<h2 style="text-align: center">Você ainda não tem roteiros favoritos.</h2>';
                            return;
                        } else {
                            divmsg.innerHTML =
                                '<h2 style="text-align: center; margin: 2rem">Roteiros Favoritos</h2>';
                        }
                        cidadesFavoritas.forEach(cidade => {
                            container.innerHTML += `
                    
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <a href="detalhesRot.html?id=${cidade.id}" class="text-decoration-none text-dark">
                            <img src="${cidade.imgPrinc}" class="card-img-top img-fluid" alt="${cidade.nome}" style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title text-center">${cidade.nome}</h5>
                                <p class="card-text">${cidade.descricao}</p>
                            </div>
                            </a>
                        </div>
                    </div>
                `;
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        document.getElementById('favoritos').innerHTML = '<p>Erro ao carregar favoritos.</p>';
                    });
            });
        </script>
        <script>
            function getUsuarioCorrente() {
                return JSON.parse(sessionStorage.getItem('usuarioCorrente')) || null;
            }

            function logoutUser() {
                sessionStorage.removeItem('usuarioCorrente');
                location.reload();
            }

            
        </script>
        <script src="assets/scripts/usuario.js"></script>
    </body>

    </html>
