        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const usuarioCorrente = JSON.parse(sessionStorage.getItem('usuarioCorrente'));
                if (!usuarioCorrente) {
                    alert('Você precisa estar logado para ver os favoritos.');
                    window.location.href = 'login.html';
                    return;
                }

                fetch('http://localhost:3000/roteirosProntos')
                    .then(res => res.json())
                    .then(cidades => {
                        const favoritos = usuarioCorrente.favoritos || [];
                        const cidadesFavoritas = cidades.filter(cidade => favoritos.includes(cidade.id));
                        const container = document.getElementById('favoritos')
                        const divmsg = document.getElementById('msgFav');
                        divmsg.innerHTML = '';

                        if (cidadesFavoritas.length === 0) {
                            divmsg.innerHTML =
                                '<h2 style="text-align: center">Você ainda não tem roteiros favoritos.</h2>';
                            return;
                        } else {
                            divmsg.innerHTML =
                                '<h2 style="text-align: center; margin: 2rem">Roteiros Favoritos</h2>';
                        }
                        cidadesFavoritas.forEach(cidade => {
                            container.innerHTML += `
                    
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <a href="detalhesRot.html?id=${cidade.id}" class="text-decoration-none text-dark">
                            <img src="${cidade.imgPrinc}" class="card-img-top img-fluid" alt="${cidade.nome}" style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title text-center">${cidade.nome}</h5>
                                <p class="card-text">${cidade.descricao}</p>
                            </div>
                            </a>
                        </div>
                    </div>
                `;
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        document.getElementById('favoritos').innerHTML = '<p>Erro ao carregar favoritos.</p>';
                    });
            });
        </script>
        <script>
            function getUsuarioCorrente() {
                return JSON.parse(sessionStorage.getItem('usuarioCorrente')) || null;
            }

            function logoutUser() {
                sessionStorage.removeItem('usuarioCorrente');
                location.reload();
            }

            
        </script>
        <script>
function sairConta() {
  // Verificar se existe um usuário logado
  const usuario = sessionStorage.getItem("usuarioCorrente");

  if (!usuario) {
    alert("Nenhum usuário está logado no momento.");
    return;
  }

  // Limpar o sessionStorage e variáveis
  sessionStorage.removeItem("usuarioCorrente");
  usuarioCorrente = null;

  // Limpar campos se existirem
  if (document.getElementById("login")) document.getElementById("login").value = "";
  if (document.getElementById("nomecompleto")) document.getElementById("nomecompleto").value = "";
  if (document.getElementById("email")) document.getElementById("email").value = "";
  if (document.getElementById("senha")) document.getElementById("senha").value = "";

  // Limpar textos e imagens do perfil, se existirem
  if (document.getElementById("nome-usuario")) document.getElementById("nome-usuario").textContent = "";
  if (document.getElementById("usuario-nome-topo")) document.getElementById("usuario-nome-topo").textContent = "";
  if (document.getElementById("avatar")) document.getElementById("avatar").src = "assets/img/imglogin.png";
  if (document.getElementById("avatar-topo")) document.getElementById("avatar-topo").src = "assets/img/imglogin.png";

  alert("Você saiu da conta.");
  window.location.href = "index.html";
}

function toggleMenu() {
  const menu = document.getElementById('sideMenu');
  menu.classList.toggle('open');
}

document.getElementById('darkModeToggle')?.addEventListener('change', function () {
  document.body.classList.toggle('dark-mode', this.checked);
});

const botaoSair = document.getElementById("sair_conta");
if (botaoSair) {
  botaoSair.addEventListener("click", sairConta);
}
</script>
