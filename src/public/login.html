<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login SmartTravel</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div id="login">
    <h3 class="text-center pt-5" style="color: orange; font-style: italic; font-weight: bold; font-size: 5rem;">SmartTravel</h3>
    <div class="container">
      <div id="login-row" class="row justify-content-center align-items-center">
        <div id="login-column" class="col-md-6">
          <div id="login-box" class="col-md-12">
            <!-- FORMULÁRIO LOGIN SEM O onsubmit -->
            <form id="login-form" class="form" method="post">
              <h3 class="text-center text-info">Login</h3>
              <div class="form-group">
                <label for="username" class="text-info" style="font-size: 2rem;">Usuário</label><br>
                <input type="text" name="username" id="username" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="password" class="text-info" style="font-size: 2rem;">Senha</label><br>
                <input type="password" name="password" id="password" class="form-control" required>
              </div>
              <div class="form-group text-end pt-2">
                <button type="button" class="btn" data-toggle="modal" data-target="#loginModal" style="font-size: 1.5rem; background-color: blue; color: white;">Cadastrar Usuário</button>
                <input type="submit" name="submit" class="btn btn-md" value="Login" style="font-size: 1.5rem;background-color: blue; color: white;">
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Novo Usuário</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div id="login-box" class="col-md-12">
            <!-- FORMULÁRIO DE CADASTRO COM ID DIFERENTE -->
            <form id="cadastro-form" class="form" method="post">
              <h3 class="text-center text-info">Cadastrar novo usuário</h3>
              <div class="form-group">
                <label for="txt_login" class="text-info">Usuário</label><br>
                <input type="text" name="txt_login" id="txt_login" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="txt_nome" class="text-info">Nome completo</label><br>
                <input type="text" name="txt_nome" id="txt_nome" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="txt_email" class="text-info">Email</label><br>
                <input type="email" name="txt_email" id="txt_email" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="txt_senha" class="text-info">Senha</label><br>
                <input type="password" name="txt_senha" id="txt_senha" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="txt_senha2" class="text-info">Confirmação de Senha</label><br>
                <input type="password" name="txt_senha2" id="txt_senha2" class="form-control" required>
              </div>
            </form>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="button" id="btn_salvar" class="btn btn-info">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Usuários simulados armazenados no localStorage
    let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [
      { login: 'MartaS', senha: 'senha1234567', nomecompleto: 'Marta Scalzo', email: 'marta@example.com', admin: true },
      { login: 'João', senha: 'joaopedefeijao', nomecompleto: 'João Ferreira', email: 'joao@example.com', admin: false },
      { login: 'Larissa', senha: 'lirili2014', nomecompleto: 'Larissa Menezes', email: 'larissa@example.com', admin: false }
    ];

    function salvarUsuarios() {
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
    }

    // Função para validar login
    function loginUser(username, password) {
      const usuario = usuarios.find(u => u.login === username && u.senha === password);
      if (usuario) {
        localStorage.setItem('usuarioLogado', JSON.stringify(usuario));
        console.log(usuario.login);
        return true;
      }
      return false;
    }

    // Processa o envio do formulário de login
    function processaFormLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('Por favor, preencha usuário e senha');
        return;
      }

      const resultadoLogin = loginUser(username, password);
      if (resultadoLogin) {
        alert('Login realizado com sucesso!');
        window.location.href = 'index.html'; // redireciona para página inicial
                localStorage.setItem('usuarioLogado', JSON.stringify({ login: usuario.login }));

      } else {
        alert('Usuário ou senha incorretos');
      }
    }

    // Salva novo usuário no localStorage
    function salvaLogin(event) {
      event.preventDefault();

      const login = document.getElementById('txt_login').value.trim();
      const nome = document.getElementById('txt_nome').value.trim();
      const email = document.getElementById('txt_email').value.trim();
      const senha = document.getElementById('txt_senha').value;
      const senha2 = document.getElementById('txt_senha2').value;
      const admin = false;

      if (!login || !nome || !email || !senha || !senha2) {
        alert('Por favor, preencha todos os campos.');
        return;
      }

      if (senha !== senha2) {
        alert('As senhas informadas não conferem.');
        return;
      }

      // Verifica se o login já existe
      const existe = usuarios.some(u => u.login === login);
      if (existe) {
        alert('Usuário já cadastrado, escolha outro login.');
        return;
      }

      // Adiciona novo usuário
      usuarios.push({ login, senha, nomecompleto: nome, email, admin });
      salvarUsuarios();

      alert('Usuário cadastrado com sucesso!');

      // Fecha o modal
      $('#loginModal').modal('hide');

      // Limpa formulário de cadastro
      document.getElementById('cadastro-form').reset();
    }

    // Evento de submit do formulário de login
    document.getElementById('login-form').addEventListener('submit', processaFormLogin);

    // Evento click do botão salvar do cadastro
    document.getElementById('btn_salvar').addEventListener('click', salvaLogin);
  </script>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>
</body>
</html>
