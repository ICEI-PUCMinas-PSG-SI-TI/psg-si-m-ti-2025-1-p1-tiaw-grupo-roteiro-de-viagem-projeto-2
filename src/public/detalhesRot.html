<script>
function sairConta() {
  // Verificar se existe um usuário logado
  const usuario = sessionStorage.getItem("usuarioCorrente");

  if (!usuario) {
    alert("Nenhum usuário está logado no momento.");
    return;
  }

  // Limpar o sessionStorage e variáveis
  sessionStorage.removeItem("usuarioCorrente");
  usuarioCorrente = null;

  // Limpar campos se existirem
  if (document.getElementById("login")) document.getElementById("login").value = "";
  if (document.getElementById("nomecompleto")) document.getElementById("nomecompleto").value = "";
  if (document.getElementById("email")) document.getElementById("email").value = "";
  if (document.getElementById("senha")) document.getElementById("senha").value = "";

  // Limpar textos e imagens do perfil, se existirem
  if (document.getElementById("nome-usuario")) document.getElementById("nome-usuario").textContent = "";
  if (document.getElementById("usuario-nome-topo")) document.getElementById("usuario-nome-topo").textContent = "";
  if (document.getElementById("avatar")) document.getElementById("avatar").src = "assets/img/imglogin.png";
  if (document.getElementById("avatar-topo")) document.getElementById("avatar-topo").src = "assets/img/imglogin.png";

  alert("Você saiu da conta.");
  window.location.href = "index.html";
}

function toggleMenu() {
  const menu = document.getElementById('sideMenu');
  menu.classList.toggle('open');
}

document.getElementById('darkModeToggle')?.addEventListener('change', function () {
  document.body.classList.toggle('dark-mode', this.checked);
});

const botaoSair = document.getElementById("sair_conta");
if (botaoSair) {
  botaoSair.addEventListener("click", sairConta);
}

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id'); // ID do roteiro vindo da URL

    fetch(`http://localhost:3000/roteirosProntos/${id}`)
        .then(res => res.json())
        .then(roteiro => {
            const comentarios = roteiro.avaliacoes || [];
            const container = document.getElementById('comentarios_container');

            container.innerHTML = '';

            if (comentarios.length === 0) {
                container.innerHTML = '<p>Sem comentários ainda.</p>';
                return;
            }

            comentarios.forEach(comentario => {
                const blocoComentario = document.createElement('div');
                blocoComentario.classList.add('mb-5');

                const cabecalho = document.createElement('div');
                cabecalho.classList.add('usuario_data_estrelas');

                const divUsuario = document.createElement('div');
                divUsuario.classList.add('usuario');
                divUsuario.innerHTML = `<strong>${comentario.usuario}</strong>`;

                const divData = document.createElement('div');
                divData.classList.add('data_publicao');
                divData.textContent = comentario.data_publicacao || comentario.data;

                const divEstrelas = document.createElement('div');
                divEstrelas.classList.add('quant_estrelas');
                const estrelas = '★'.repeat(comentario.quant_estrelas) + '☆'.repeat(5 - comentario.quant_estrelas);
                divEstrelas.innerHTML = `<span style="color: #ffc107; font-size: 1.2rem;">${estrelas}</span>`;

                cabecalho.appendChild(divUsuario);
                cabecalho.appendChild(divData);
                cabecalho.appendChild(divEstrelas);

                const divConteudo = document.createElement('div');
                divConteudo.classList.add('conteudo');
                divConteudo.textContent = comentario.conteudo;

                blocoComentario.appendChild(cabecalho);
                blocoComentario.appendChild(divConteudo);

                container.appendChild(blocoComentario);
            });

            // Mostra a seção com os comentários
            document.getElementById('secaocomentarios').style.display = 'block';
        })
    </script>
    <script>
        const estrelasDiv = document.getElementById('avaliacao_estrelas');
        const inputEstrelas = document.getElementById('quant_estrelas');
        const form = document.getElementById('form_comentario');

        // Estrelas
        estrelasDiv.addEventListener('click', function (event) {
            if (event.target.tagName === 'SPAN') {
                const valor = Number(event.target.getAttribute('data-estrela'));
                inputEstrelas.value = valor;

                const estrelas = estrelasDiv.querySelectorAll('span');
                estrelas.forEach((estrela, index) => {
                    estrela.textContent = index < valor ? '★' : '☆';
                });
            }
        });

        // Envio do formulário
        form.addEventListener('submit', function (e) {
    e.preventDefault();

    const comentario = document.getElementById('comentario_texto').value.trim();
    const numeroEstrelas = parseInt(document.getElementById('quant_estrelas').value);
    const idRoteiro = new URLSearchParams(window.location.search).get('id');

    if (!comentario || numeroEstrelas === 0) {
        alert('Por favor, escreva um comentário e selecione uma quantidade de estrelas.');
        return;
    }

    const usuarioInfo = JSON.parse(localStorage.getItem('usuarioLogado'));

    fetch('http://localhost:3000/usuarios')
        .then(res => res.json())
        .then(usuarios => {
            const dadosUsuario = sessionStorage.getItem("usuarioCorrente");
            const usuario = JSON.parse(dadosUsuario);
            const nome_login = (usuario.login).toUpperCase();
            // const usuario = usuarios.find(u => u.email === usuarioInfo?.email);
            // const login = usuario ? usuario.login : 'Desconhecido';

            // 1. Busca o roteiro atual
            return fetch(`http://localhost:3000/roteirosProntos/${idRoteiro}`)
                .then(res => res.json())
                .then(roteiro => {
                    // 2. Gera novo ID
                    const avaliacoes = roteiro.avaliacoes || [];
                    const ultimoComentario = avaliacoes[avaliacoes.length - 1];
                    const novoId = ultimoComentario ? Number(ultimoComentario.id) + 1 : 1;

                    // 3. Cria novo comentário
                    const novoComentario = {
                        id: novoId,
                        usuario: nome_login,
                        data_publicacao: new Date().toLocaleDateString('pt-BR'),
                        conteudo: comentario,
                        quant_estrelas: numeroEstrelas
                    };

                    // 4. Adiciona ao array e envia PUT com o roteiro atualizado
                    const novoRoteiro = {
                        ...roteiro,
                        avaliacoes: [...avaliacoes, novoComentario]
                    };

                    return fetch(`http://localhost:3000/roteirosProntos/${idRoteiro}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(novoRoteiro)
                    });
                });
        })
        .then(res => {
            if (!res.ok) throw new Error('Erro ao salvar');
            return res.json();
        })
        .then(() => {
            // alert('Comentário enviado com sucesso! Recarregue a página para vê-lo.');
            location.reload();
        })
        .catch(err => {
            console.error(err);
            alert('Erro ao enviar comentário.');
        });
});
    </script>
   
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        document.querySelector('#baixapdf').addEventListener('click', function () {
            const elemento = document.getElementById('conteudo-rot');

            if (!elemento) {
                alert("Conteúdo não encontrado para gerar o PDF.");
                return;
            }

            // Aguarda renderização completa do DOM
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const opt = {
                        margin: 10,
                        filename: 'meu-roteiro.pdf',
                        image: {
                            type: 'jpeg',
                            quality: 1
                        },
                        html2canvas: {
                            scale: 2,
                            useCORS: true
                        },
                        jsPDF: {
                            unit: 'mm',
                            format: 'a4',
                            orientation: 'portrait'
                        },
                        pagebreak: {
                            mode: ['avoid-all', 'css', 'legacy']
                        }
                    };

                    html2pdf().set(opt).from(elemento).save();
                }, 2000); // espera 500ms para tudo estar 100% visível
            });
        })
        
        
    

    </script>
