<html lang="pt-br">
<head>

        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">

</head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
    }
    header {
      background-color: #ff7f00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      color: white;
    }
    header img.logo {
      height: 40px;
    }
    header .perfil {
      display: flex;
      align-items: center;
    }
    header .perfil span {
      margin-right: 10px;
    }
    main {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .voltar,
    .acao {
      display: inline-block;
      margin: 10px 10px 20px 0;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .voltar:hover,
    .acao:hover {
      background-color: #0056b3;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    .info-grid div {
      font-size: 16px;
    }
    #recomendacoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #ff7f00;
    }
    .card p {
      margin: 0;
      font-size: 16px;
    }
    html, body{

    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

.cab{

    background-color: #ea8613;

}
.menu-btn {
    background: none;
    border: none;
    font-size: 24px;
    margin-right: 10px;
    cursor: pointer;
}

.side-menu {
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100vh;
    background-color: #fff;
    box-shadow: 2px 0 5px rgba(0,0,0,0.3);
    padding: 20px;
    z-index: 1000;
    transition: left 0.3s ease;
    overflow-y: auto;
}

.side-menu.open {
    left: 0;
}

.side-menu .menu-content {
    display: flex;
    flex-direction: column;
}

.side-menu ul {
    list-style: none;
    padding: 0;
    margin-top: 20px;
}

.side-menu ul li {
    margin: 15px 0;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
}

.recom-btn {
    background-color: #007bff;
    color: white;
    border: none;
    margin-top: 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.footer-menu {
    display: flex;
    flex-direction: column;
    margin-top: 20px;
    font-size: 14px;
    color: #f57c00;
    display: flex;
    justify-content: space-between;
}

.modo-escuro {
    font-weight: bold;
    margin-top: 10px;
    margin-bottom: 10px;
}

.switch {
    position: relative;
    display: inline-block;
    width: 34px;
    height: 20px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0;
    right: 0; bottom: 0;
    background-color: #ccc;
    transition: 0.4s;
    border-radius: 34px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 14px; width: 14px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: 0.4s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: #2196F3;
}
.sair-btn {
    color: #f57c00;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    border: none;
}

.sair-btn:hover {
    text-decoration: underline;
}

input:checked + .slider:before {
    transform: translateX(14px);
}

h6{

    margin-bottom: 3px !important;

}

.selectfilter{

    width: 100%;

}

input[type="text"]{

    border: 1px solid gray;
    border-radius: 10px;
    padding-left: 10px;

}

#logo{

    height: 60px; 
    width: 100px;
    margin-left: 20px;
    background-color:  white;

}

#iconworld{

    right: 300px;
    bottom: 0;
    margin: 0;
    color: white;

}

#nomelogin{

    right: 130px;
    bottom: 0;
    margin: 0;
    background-color: white; font-size: 18px;

}

#iconuser{

    right: 0;
    top: 50%; 
    transform: translateY(-50%);
    color: white; 
    margin-right: 75px;

}
  </style>
</head>
<body>

                    <a href="PerfilUsuario.html"><li><i class="fa-regular fa-user"></i> Minha conta</li></a>

                    <a href="meusroteiros.html"><li><i class="fa-regular fa-map"></i> Meus roteiros</li></a>
                    <li><a href="avaliacoes.html"><i class="fa-regular fa-star"></i> Avaliações</li></a>
                    <li><a href="faq.html"><i class="fa-regular fa-circle-question"></i> FAQ</li></a>
                    <li><a href="minhasduvidas.html"><i class="fa-regular fa-comment-dots"></i> Minhas dúvidas</li></a>

                <a href="painel.html"><button class="recom-btn"><i class="fa-solid fa-plus"></i> CADASTRAR RECOMENDAÇÕES

        <!-- MUDANÇAS!!!!!!!!! ALTERAR O CAMINHO DA IMAGEM -->

        <p class="position-absolute py-1 px-3" id="nomelogin">LOGIN</p>
        <a href="PerfilUsuario.html"><i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i></a>

  <main>
    <a href="crud.html" class="voltar">VOLTAR</a>
    <h2>ROTEIRO CRIADO</h2>

    <div class="info-grid" id="infoRoteiro"></div>

    <div>
      <button class="acao" id="btnEditar">EDITAR</button>
      <button class="acao" id="btnExcluir">EXCLUIR</button>
    </div>

    <h2>RECOMENDAÇÕES PARA ESTA CIDADE</h2>
    <div id="recomendacoes"></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        alert("ID do roteiro não fornecido.");
        window.location.href = "crud.html";
        return;
      }

      const rotaRoteiros = 'http://localhost:3000/roteiros';
      const rotaRecomendacoes = 'http://localhost:3000/recomendacoes';

      try {
        const resRoteiro = await fetch(`${rotaRoteiros}/${id}`);
        if (!resRoteiro.ok) throw new Error("Roteiro não encontrado.");
        const roteiro = await resRoteiro.json();

        const infoDiv = document.getElementById("infoRoteiro");

        const mostrar = val => (Array.isArray(val) ? val.join(", ") : val);

        infoDiv.innerHTML = `
          <div><strong>Ida:</strong> ${roteiro.ida}</div>
          <div><strong>Volta:</strong> ${roteiro.volta}</div>
          <div><strong>Pessoas:</strong> ${roteiro.pessoas}</div>
          <div><strong>Orçamento:</strong> R$ ${roteiro.orcamento}</div>
          <div><strong>Estado:</strong> ${roteiro.estado}</div>
          <div><strong>Cidade:</strong> ${roteiro.cidade}</div>
          <div><strong>Pet:</strong> ${mostrar(roteiro.pet)}</div>
          <div><strong>Piscina:</strong> ${mostrar(roteiro.piscina)}</div>
          <div><strong>Quartos:</strong> ${mostrar(roteiro.quartos)}</div>
          <div><strong>Garagem:</strong> ${mostrar(roteiro.garagem)}</div>
        `;

        // Buscar recomendações com base na cidade
        const resRec = await fetch(`${rotaRecomendacoes}?cidade=${encodeURIComponent(roteiro.cidade)}`);
        const recomendacoes = await resRec.json();

        const recDiv = document.getElementById("recomendacoes");
        if (recomendacoes.length) {
          recDiv.innerHTML = recomendacoes.map(r => `
            <div class="card">
              <h3>${r.nome}</h3>
              <p>Tipo: ${r.tipo}</p>
            </div>
          `).join('');
        } else {
          recDiv.innerHTML = "<p>Sem recomendações para esta cidade.</p>";
        }

        // Botão editar
        document.getElementById("btnEditar").onclick = () => {
          localStorage.setItem("editarRoteiro", JSON.stringify(roteiro));
          window.location.href = "crud.html";
        };

        // Botão excluir
        document.getElementById("btnExcluir").onclick = async () => {
          if (confirm("Deseja realmente excluir este roteiro?")) {
            const resDel = await fetch(`${rotaRoteiros}/${id}`, { method: "DELETE" });
            if (resDel.ok) {
              alert("Roteiro excluído com sucesso!");
              window.location.href = "crud.html";
            } else {
              alert("Erro ao excluir o roteiro.");
            }
          }
        };

      } catch (err) {
        alert("Erro: " + err.message);
        window.location.href = "crud.html";
      }
    });
  </script>
</body>
