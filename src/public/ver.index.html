<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Smart Travel - Ver Roteiro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
    }
    header {
      background-color: #ff7f00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      color: white;
    }
    header img.logo {
      height: 40px;
    }
    header .perfil {
      display: flex;
      align-items: center;
    }
    header .perfil span {
      margin-right: 10px;
    }
    main {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .voltar,
    .acao {
      display: inline-block;
      margin: 10px 10px 20px 0;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .voltar:hover,
    .acao:hover {
      background-color: #0056b3;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    .info-grid div {
      font-size: 16px;
    }
    #recomendacoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #ff7f00;
    }
    .card p {
      margin: 0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://via.placeholder.com/100x40?text=Smart+Travel" alt="Logo" class="logo" />
    <div class="perfil">
      <span>MARTA</span>
      <img src="https://via.placeholder.com/40" alt="Usuário" style="border-radius: 50%" />
    </div>
  </header>

  <main>
    <a href="crud.html" class="voltar">VOLTAR</a>
    <h2>ROTEIRO CRIADO</h2>

    <div class="info-grid" id="infoRoteiro"></div>

    <div>
      <button class="acao" id="btnEditar">EDITAR</button>
      <button class="acao" id="btnExcluir">EXCLUIR</button>
    </div>

    <h2>RECOMENDAÇÕES PARA ESTA CIDADE</h2>
    <div id="recomendacoes"></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        alert("ID do roteiro não fornecido.");
        window.location.href = "crud.html";
        return;
      }

      const rotaRoteiros = 'http://localhost:3000/roteirosProntos'; // Atualize para a rota correta
      const rotaRecomendacoes = 'http://localhost:3000/recomendacoes';

      try {
        const resRoteiro = await fetch(`${rotaRoteiros}/${id}`);
        if (!resRoteiro.ok) throw new Error("Roteiro não encontrado.");
        const roteiro = await resRoteiro.json();

        const infoDiv = document.getElementById("infoRoteiro");

        const mostrar = val => (Array.isArray(val) ? val.join(", ") : val);

        infoDiv.innerHTML = `
          <div><strong>Nome:</strong> ${roteiro.nome}</div>
          <div><strong>Ida:</strong> ${roteiro.ida}</div>
          <div><strong>Volta:</strong> ${roteiro.volta}</div>
          <div><strong>Pessoas:</strong> ${roteiro.pessoas}</div>
          <div><strong>Orçamento:</strong> R$ ${roteiro.orcamento}</div>
          <div><strong>Estado:</strong> ${roteiro.estado}</div>
          <div><strong>Cidade:</strong> ${roteiro.cidade}</div>
          <div><strong>Pet:</strong> ${mostrar(roteiro.pet)}</div>
          <div><strong>Piscina:</strong> ${mostrar(roteiro.piscina)}</div>
          <div><strong>Quartos:</strong> ${mostrar(roteiro.quartos)}</div>
          <div><strong>Garagem:</strong> ${mostrar(roteiro.garagem)}</div>
        `;

        // Buscar recomendações para a cidade do roteiro
        const resRec = await fetch(`${rotaRecomendacoes}?cidade=${encodeURIComponent(roteiro.cidade)}`);
        if (!resRec.ok) throw new Error("Erro ao buscar recomendações.");
        const recomendacoes = await resRec.json();

        const recDiv = document.getElementById("recomendacoes");
        if (recomendacoes.length) {
          recDiv.innerHTML = recomendacoes.map(r => `
            <div class="card">
              <h3>${r.nome}</h3>
              <p>Tipo: ${r.tipo}</p>
            </div>
          `).join('');
        } else {
          recDiv.innerHTML = "<p>Sem recomendações para esta cidade.</p>";
        }

        // Botão editar
        document.getElementById("btnEditar").onclick = () => {
          localStorage.setItem("editarRoteiro", JSON.stringify(roteiro));
          window.location.href = "crud.html";
        };

        // Botão excluir
        document.getElementById("btnExcluir").onclick = async () => {
          if (confirm("Deseja realmente excluir este roteiro?")) {
            const resDel = await fetch(`${rotaRoteiros}/${id}`, { method: "DELETE" });
            if (resDel.ok) {
              alert("Roteiro excluído com sucesso!");
              window.location.href = "crud.html";
            } else {
              alert("Erro ao excluir o roteiro.");
            }
          }
        };

      } catch (err) {
        alert("Erro: " + err.message);
        window.location.href = "crud.html";
      }
    });
  </script>
</body>
</html>
