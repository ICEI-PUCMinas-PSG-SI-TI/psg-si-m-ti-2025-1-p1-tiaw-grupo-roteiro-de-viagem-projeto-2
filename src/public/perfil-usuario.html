<!DOCTYPE html>
<html lang="pt-br">
<!--COLOCAR: json-server --watch src/db/db.json --port 3000 --static src/public-->
<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/perfil.css">
  <link rel="shortcut icon" type="imagex/png" href="img/aviaoeseta.png">
</head>

<body onload="carregarPerfis()">
  <!--cabeçalho-->
  <nav class="navbar custom-navbar">
    <div class="container-fluid">
      <div class="navbar-brand d-flex align-items-center" href="PerfilUsuario.html">
        <a href="index.html"><img id="logo" src="img/logo.png" alt="Logo" height="40" class="me-2"></a>
      </div>
      <div class="text-white">
        <span class="me-3 fw-bold text-dark" id="usuario-nome-topo">NOME</span>
        <!--menu de opções-->
        <button type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          <span><img id="avatar-topo" alt="" width="40" height="40"></span>
        </button>
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="titulo">SmartTravel</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-center align-items-center flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link" href="#">Inicio <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                    <path
                      d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
                  </svg></a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="roteiros.html">Roteiros Salvos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Editar Perfil</a>
              </li>
              <!--trocar de usuario-->
            </ul>
             <div class="dropdown mt-3">
                <button class="btn custom-buttom2 dropdown-toggle w-100" type="button" id="dropdownTrocarConta"
                  data-bs-toggle="dropdown" aria-expanded="false">
                  Trocar conta
                </button>
                <ul class="dropdown-menu w-100" aria-labelledby="dropdownTrocarConta" id="listaUsuarios"></ul>
              </div>
            <div class="mt-4">
              <button class="btn btn-outline-danger w-100" onclick="sairConta()">Sair da conta</button>
            </div>
          </div>
        </div>
      </div>
  </nav>
  <!--pagina de perfil-->
  <!--TITULO perfil/roteiros salvos -->
  <div class="container mt-4" id="bordaFina">
    <div class="d-flex container mt-4" id="titulo">
      <h3 class="fw-bold">PERFIL</h3>
      <a class="rounded-pill roteiros-salvos btn-sm fw-bold" href="roteiros.html">ROTEIROS SALVOS</a>
    </div>
  </div>
  <!--imagem e dados-->
  <div class="container mt-5">
    <div class="text-center mb-4">
      <img src="img/b1.png" alt="" width="200px" id="testes">
      <img id="avatar" src="" class="rounded-circle" width="200" height="200">
      <img src="img/b2.png" alt="" width="200px" id="testes">

      
      <h2 id="nome-usuario" class="mt-3"></h2>
    </div>

    <form onsubmit="salvarAlteracoes(event)" class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome">
      </div>

      <div class="mb-3">
        <label for="sobrenome" class="form-label">Sobrenome</label>
        <input type="text" class="form-control" id="sobrenome">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email">
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha">
        <div class="form-check mt-1">
          <input class="form-check-input" type="checkbox" id="mostrarSenha" onclick="toggleSenha()">
          <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
        </div>

        <button type="submit" class="mt-3 btn custom-buttom text-white">Salvar alterações</button>
      </div>
    </form>
  </div>
  <!--rodapé-->
  <footer class="container-fluid" id="degrade">
    © Todos os direitos reservados.
  </footer>


  <!--senha check + scripts-->
  <script>
    function toggleSenha() {
      const input = document.getElementById("senha");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>
  <script src="assets/perfil.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>


</html>
