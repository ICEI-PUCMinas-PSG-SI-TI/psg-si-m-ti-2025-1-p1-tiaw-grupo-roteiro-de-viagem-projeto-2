<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTravel</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header class="d-flex cab position-relative cab container-fluid">
        <img src="logo.png" id="logo">
        <p class="position-absolute" id="iconworld">BRL <i class="fa-solid fa-earth-americas"></i></p>
        <p class="position-absolute py-1 px-3" id="nomelogin"><strong>MARTA</strong></p>
        <i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i>
    </header>

    <div class="titulo">
        <div class="d-flex justify-content-center mt-5">
            <h4>PAINEL DO ADIMINISTRADOR</h4>
        </div>
    </div>

    <main>
        <form>
            <button type="button" class="btn-arzenamentos">ARMAZENAMENTOS</button>
            <div id="duvida">COMENTÁRIOS</div>
            <button type="button" class="btn-ver">VER AS DÚVIDAS</button>
            <button type="button" class="btn-apagar">DELETAR</button>
        </form>
        <div id="comentarios" class="mt-4"></div>
    </main>

    <footer>
        <div class="d-flex align-items-center">
            <div class="rodape">
                <i class="fa-solid fa-copyright"></i>
                <p style="margin: 0;">Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="util.js"></script>
</body>
</html>
