    <script>

    <div class="d-flex justify-content-center mt-5">
        <h4 id="titlesection">BUSCA POR ROTEIROS PRONTOS</h4>
    </div>

    <section class="d-block d-lg-flex mt-4 py-lg-1 container d-block align-items-center" id="sectionfilter"
        style="overflow-x: scroll; scroll-behavior: smooth;">
        <div class="d-flex align-items-center ps-sm-3 pe-sm-3 divfilter filterborderright">
            <i class="fa-solid fa-magnifying-glass iconfilter"></i>
            <div class="ps-2 selectfilter">
                <h6>DESTINOS</h6>
                <input type="text" class="selectfilter" id="inputdestinos">
                <ul id="sugestoes"
                    style="position: absolute;background: white;z-index: 1000; list-style: none; padding: 0; margin: 0;">
                </ul>
            </div>

        </div>
        <script>
            let destinos = [];

            fetch("http://localhost:3000/roteirosProntos")
                .then(res => res.json())
                .then(data => {
                    destinos = data;
                });

            const input = document.getElementById("inputdestinos");
            const sugestoes = document.getElementById("sugestoes");

            input.addEventListener("input", () => {
                const termo = input.value.toLowerCase();
                sugestoes.innerHTML = "";

                if (termo === "") return;

                const filtrados = destinos.filter(destino =>
                    destino.cidade.toLowerCase().includes(termo)
                );

                filtrados.forEach(destino => {
                    const li = document.createElement("li");
                    li.textContent = destino.cidade;
                    li.style.padding = "5px 10px";
                    li.style.cursor = "pointer";

                    li.addEventListener("click", () => {
                        input.value = destino.cidade;
                        sugestoes.innerHTML = "";
                    });

                    sugestoes.appendChild(li);
                });
            });
        </script>

        <div class="d-flex align-items-center ps-sm-3 pe-sm-3 divfilter filterborderright">
            <i class="fa-solid fa-users iconfilter"></i>
            <div class="ps-2 selectfilter">
                <h6>HÓSPEDES</h6>
                <form>
                    <select class="selectfilter" id="inputpessoas">
                        <option disabled selected></option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                    </select>
                </form>
            </div>
        </div>

        <div class="d-flex align-items-center ps-sm-3 pe-sm-3 divfilter filterborderright">

            <i class="fa-solid fa-plane iconfilter" style="transform: rotate(-45deg);"></i>
            <div class="ps-2 selectfilter">
                <h6>TRANSPORTE</h6>
                <form>
                    <select class="inputfilter selectfilter" id="transportechoice">
                        <option disabled selected></option>
                        <option>Carro</option>
                        <option>Avião</option>
                        <option>Ambos</option>
                    </select>
                </form>
            </div>

        </div>
        <div class="d-flex align-items-center ps-sm-3 pe-sm-3 divfilter filterborderright">
            <i class="fa-solid fa-tree iconfilter"></i>
            <div class="ps-2 selectfilter">
                <h6>Estação do</h6>
                <form action="">
                    <select class="selectfilter" style="width: 100%;" id="inputestacao">
                        <option disabled selected></option>
                        <option>Verão</option>
                        <option>Primavera</option>
                        <option>Outono</option>
                        <option>Inverno</option>
                    </select>
                </form>
            </div>

        </div>
        <div class="d-flex align-items-center divfilter ps-sm-3 pe-sm-3">
            <i class="fa-solid fa-dollar-sign iconfilter"></i>
            <div class="ps-2 selectfilter">
                <h6>Preço p/ noite</h6>
                <input type="text" placeholder="R$" class="selectfilter" id="inputpreco">
                <ul id="listaprecos"
                    style="display: block; position: absolute;background: white;z-index: 1000; list-style: none; padding: 0; margin: 0; width: 100px;">
                </ul>
            </div>
        </div>
        <script>
            const inputPreco = document.getElementById('inputpreco');
            const listaPrecos = document.getElementById('listaprecos');

            async function buscarPrecos() {
                try {
                    const response = await fetch('http://localhost:3000/roteirosProntos');
                    const dados = await response.json();
                    return dados.map(item => item.precoPorNoite); // usa 'precoPorNoite' do JSON
                } catch (error) {
                    console.error('Erro ao buscar preços:', error);
                    return [];
                }
            }

            inputPreco.addEventListener('input', async () => {
                const valor = inputPreco.value.trim();
                listaPrecos.innerHTML = '';

                if (valor === '') return;

                const precos = await buscarPrecos();
                const precosUnicos = [...new Set(precos)];
                const filtrados = precosUnicos.filter(p => p.toString().startsWith(valor));

                if (filtrados.length === 0) {
                    const li = document.createElement('li');
                    li.textContent = 'Nenhum preço encontrado';
                    li.style.padding = '5px';
                    listaPrecos.appendChild(li);
                    return;
                }

                filtrados.forEach(p => {
                    const li = document.createElement('li');
                    li.textContent = `R$ ${p},00`;
                    li.style.padding = '5px';
                    li.style.cursor = 'pointer';

                    li.addEventListener('click', () => {
                        inputPreco.value = p;
                        listaPrecos.innerHTML = '';
                    });

                    listaPrecos.appendChild(li);
                });
            });
        </script>
        </script>

        <a id="detalheslink"><button id="buttonsearch" class="my-2" style="width: 100%;">PESQUISAR</button></a>

    </section>



    <main>
        <div id="compartimento1" class=" container text-center mt-5" style="position: relative;">
            <div>
                <h4 id="titlesection" style="margin-bottom: 40px;">CRIE SEU PRÓPRIO ROTEIRO</h4>
                <a><button id="buttoncomecar" class="mt-3" style="margin-bottom: 50px;">COMEÇAR</button></a>
                <img src="assets/img/aviaocriar.jpg" id="aviaocriar" style="position: absolute; width: 150px;" alt="">
            </div>
            <h4 id="titlesection" class="mt-3">RECOMENDAÇÕES</h4>
        </div>
        <section class="d-flex container-fluid mt-3 p-3 gap-4 position-relative" id="secaorecomendados">
            <div id="recomendados" style="overflow: auto; scrollbar-width: none;" class="d-flex gap-4">

            </div>
            <div>
                <i class="fa-solid fa-arrow-right position-absolute controls" style="right: 2%;bottom: 50%; opacity: 0;"
                    id="gonext"></i>
                <i class="fa-solid fa-arrow-left position-absolute controls" id="goprev"
                    style="left: 2%; bottom: 50% ;opacity: 0;"></i>
            </div>


        </section>

        <script>
            let dadosCidades = [];
            fetch("http://localhost:3000/roteirosProntos")
                .then(res => res.json())
                .then(data => {
                    dadosCidades = data;
                    exibirCidades(dadosCidades);
                })
                .catch(err => console.error("Erro ao buscar roteiros:", err));

            function exibirCidades(lista) {
                const usuarioCorrente = JSON.parse(sessionStorage.getItem('usuarioCorrente')) || {
                    favoritos: []
                };
                const rowCidades = document.getElementById('recomendados');
                rowCidades.innerHTML = "";

                lista.forEach(roteiro => {
                    const estaNosFavoritos = usuarioCorrente.favoritos.includes(roteiro.id.toString());

                    rowCidades.innerHTML += `
                <div style="border: 1px solid black" class="justify-content-center">
                    <a href="detalhesRot.html?id=${roteiro.id}" style="text-decoration: none; color:black;">
                        <img src="${roteiro.imgPrinc}" class="imagemrecomendados" style="width:300px; height:200px; border-radius:10px;">
                        <div class="position-relative d-flex justify-content-center">
                            <p class="titulorecomendados">${roteiro.nome}</p>
                        </div>
                        <p class="descricaorecomendados" style="padding: 0 5px">${roteiro.descricao}</p> 
                    </a>  
                    <div class="card-footer text-end"></div>
                </div>
            `;
                });

                // Scroll apenas uma vez, fora do forEach
                const goNext = document.getElementById('gonext');
                const goPrev = document.getElementById('goprev');
                const recomendados = document.getElementById('recomendados');

                goNext.addEventListener('click', function () {
                    recomendados.scrollBy({
                        left: 300
                    });
                });

                goPrev.addEventListener('click', () => recomendados.scrollBy({
                    left: -300
                }));

                function AtualizarSetas() {
                    if (recomendados.scrollLeft <= 0)
                        goPrev.style.opacity = '0';
                    else
                        goPrev.style.opacity = '1';

                    if (recomendados.scrollLeft + recomendados.offsetWidth >= recomendados.scrollWidth)
                        goNext.style.opacity = '0';
                    else
                        goNext.style.opacity = '1';
                }

                recomendados.addEventListener('scroll', AtualizarSetas);
                AtualizarSetas();
            };

            let dados = {};

            document.getElementById('buttonsearch').addEventListener('click', function () {
                let cidade = document.getElementById('inputdestinos').value;
                let preco = parseInt(document.getElementById('inputpreco').value);
                let pessoas = parseInt(document.getElementById('inputpessoas').value);
                let transporte = document.getElementById('transportechoice').value;
                let estacao = document.getElementById('inputestacao').value;

                // ✅ Validação básica antes de buscar
                if (!cidade || isNaN(preco) || isNaN(pessoas) || !transporte || !estacao) {
                    return alert('Favor preencher todos os campos corretamente');
                }

                // ✅ Busca os dados do JSON Server
                fetch('http://localhost:3000/roteirosProntos')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("Erro na requisição: " + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        const objeto = data.find(objeto =>
                            objeto.cidade === cidade &&
                            objeto.pessoas >= pessoas &&
                            objeto.transporte === transporte &&
                            objeto.estacao === estacao &&
                            objeto.precoPorNoite >= preco
                        );

                        if (objeto) {
                            dados.roteiro = objeto;
                            // Exemplo: redireciona com o ID
                            document.getElementById('detalheslink').setAttribute('href',
                                `detalhesRot.html?id=${dados.roteiro.id}`);
                        } else {
                            alert('Roteiro não encontrado');
                        }
                    })
            });
        </script>
        <footer>
            <div class="d-flex align-items-center">
                <div class="rodape">
                    <i class="fa-solid fa-copyright"></i>
                    <p style="margin: 0;">Todos os direitos reservados.</p>
                </div>
            </div>
        </footer>

        <script src="assets/scripts/usuario.js"></script>
        <script src="assets/scripts/favoritos.js"></script>
</body>
