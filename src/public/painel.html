<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração</title>
    <link rel="stylesheet" href="assets/css/styleLucca.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="cab position-relative" style="height: 60px; display: flex; align-items: center;">
    <button id="menu-btn" class="menu-btn" aria-label="Abrir menu">
    ☰
    </button>
    <!-- Logo -->
    <img src="assets/img/logoST.PNG" id="logo" alt="Logo Smart Travel">

    <!-- Botão Login -->
    <p id="nomelogin" class="position-absolute">LOGIN</p>

    <!-- Ícone usuário -->
    <a href="PerfilUsuario.html">
        <i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i>
    </a>
</header>

    <div class="voltar-container">
        <button id="voltarBtn">VOLTAR</button>
    </div>

        <section class="painel">
            <h3>PAINEL DE ADMINISTRAÇÃO</h3>
            <div class="tabela">
                <p>RECOMENDAÇÕES PENDENTES</p>
                <table>
                    <thead>
                        <tr>
                            <th>USUÁRIO</th>
                            <th>DESTINO</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody>
  <!-- Os dados serão inseridos dinamicamente pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>© Todos os direitos reservados.</p>
    </footer>

    <script src="assets/scripts/app.js"></script>
    <script>
  const menuBtn = document.getElementById('menuToggle');
  const sideMenu = document.getElementById('sideMenu');

  menuBtn.addEventListener('click', () => {
    sideMenu.classList.toggle('open');
  });
</script>
</body>
</html>
