<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração</title>
    <link rel="stylesheet" href="assets/css/styleLucca.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="d-flex cab position-relative container-fluid">
    <img src="assets/img/logo.png" id="logo"/>

    <p id="iconworld">BRL <i class="fa-solid fa-earth-americas ml-1"></i></p>
    <p id="nomelogin">LOGIN</p>

    <a href="PerfilUsuario.html"><i id="iconuser" class="fa-regular fa-user fa-2x ml-1 mr-1 position-absolute"></i></a>
    </header>

    <div class="voltar-container">
        <button id="voltarBtn">VOLTAR</button>
    </div>

    <main class="container">
    <nav class="sidebar">
    <h2>DASHBOARD</h2><!-- Título Dashboard -->
    <ul>
        <li><a href="#" class="botao-menu"><i class="fa-solid fa-users"></i> CADASTROS</a></li>
        <li><a href="#" class="botao-menu"><i class="fa-regular fa-star"></i> RECOMENDAÇÕES</a></li>
        <li><a href="#" class="botao-menu"><i class="fa-solid fa-headset"></i> DÚVIDAS</a></li>
    </ul>
    <a href="#" class="botao-menu configuracoes"><i class="fa-solid fa-cog"></i> CONFIGURAÇÕES</a>
    </nav>

        <section class="painel">
            <h3>PAINEL DE ADMINISTRAÇÃO</h3>
            <div class="tabela">
                <p>RECOMENDAÇÕES PENDENTES</p>
                <table>
                    <thead>
                        <tr>
                            <th>USUÁRIO</th>
                            <th>DESTINO</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>MARTA</td>
                            <td>UBATUBA, SP</td>
                            <td>
                                <button class="btn green"></button>
                                <button class="btn red"></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>© Todos os direitos reservados.</p>
    </footer>

    <script src="assets/scripts/app.js"></script>

</html>
