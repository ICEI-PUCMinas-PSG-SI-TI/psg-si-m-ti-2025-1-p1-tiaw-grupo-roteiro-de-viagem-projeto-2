<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTravel</title>
    <link rel="stylesheet" href="style3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header class="d-flex cab position-relative cab container-fluid">
        <img src="logo.png" id="logo">
        <p class="position-absolute" id="iconworld">BRL <i class="fa-solid fa-earth-americas"></i></p>
        <p class="position-absolute py-1 px-3" id="nomelogin"><strong>MARTA</strong></p>
        <i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i>
    </header>

    <div class="titulo">
        <div class="d-flex justify-content-center mt-5">
            <div>
                <button class="btn-apagar">DELETAR</button>
            </div>
        </div>
    </div>

    <h3>MEUS COMENTARIOS</h3>

    <main>
        <button class="btn-voltar">VOLTAR</button>
        <h3>Historico</h3>
        <div class="form-container">
            <div id="comentarios"></div>
            <div class="adicionarComentario" style="display:none;"></div>
            <div class="contato">
                <label>ARMAZENAMENTO</label>
                <input type="text" placeholder="amazenamento">
                <button class="btn-ver">ver comentarios</button>
            </div>
        </div>
    </main>

    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <footer>
        <div class="d-flex align-items-center">
            <div class="rodape">
                <i class="fa-solid fa-copyright"></i>
                <p style="margin: 0;">Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>
    <script src="util.js"></script>
</body>
</html>
