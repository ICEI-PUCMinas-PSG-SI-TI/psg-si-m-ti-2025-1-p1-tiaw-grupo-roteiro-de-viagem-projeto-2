<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTravel</title>
    <link rel="stylesheet" href="cadastro_hosp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>

    <header class="d-flex cab position-relative cab container-fluid">
        <img src="./Imagens/logo1.png" id="logo">
        <p class="position-absolute" id="iconworld">BRL <i class="fa-solid fa-earth-americas"></i></p>
        <p class="position-absolute py-1 px-3" id="nomelogin"><strong>MARTA</strong></p>
        <i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i>
    </header>

    <div class="titulo">
        <div class="d-flex justify-content-center mt-5">
            <h4>CADASTRO DE RECOMENDAÇÕES</h4>
        </div>
    </div>

    <main>
        <div id="botoes" class="container-fluid">
            <button id="button_voltar" class="btn btn-primary">VOLTAR</button>
            <button id="button_recomen" class="btn btn-primary">RECOMENDAÇÕES</button>
        </div>

        <div class="container">
            <!-- titulo nao esta centralizado -->
            <h4 class="text-center" style="margin-top: 1%;">O QUE DESEJA CADASTRAR?</h4>

            <div class="d-flex justify-content-center" style="margin-top: 1%;">
                <div class="escolha_recomen text-start">
                    <div class="form-check">
                    <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="opcao1" checked>
                    <label class="form-check-label" for="exampleRadios1">
                        HOSPEDAGEM
                    </label>
                    </div>
                    <div class="form-check">
                    <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios2" value="opcao2">
                    <label class="form-check-label" for="exampleRadios2">
                        RESTAURANTE
                    </label>
                    </div>
                    <div class="form-check">
                    <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios3" value="opcao3">
                    <label class="form-check-label" for="exampleRadios3">
                        PASSEIO
                    </label>
                    </div>
                </div>
            </div>

            <form class="my-4">
                <div class="row justify-content-center" style="margin-top: 0.5%;">
                    <div class="col-md-6 text-center">
                        <label for="inputNome" class="form-label fw-bold">NOME DO LOCAL</label>
                        <input type="text" class="form-control" id="inputNome" placeholder="ESCREVA AQUI">
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-6" style="margin-top: 1%;">
                        <label for="inputEstado" class="form-label fw-bold">ESTADO (EX.: MINAS GERAIS)</label>
                        <input type="text" class="form-control" id="inputEstado" placeholder="ESCREVA AQUI">
                    </div>
                    <div class="col-md-6" style="margin-top: 1%;">
                        <label for="inputCidade" class="form-label fw-bold">CIDADE (EX.: BELO HORIZONTE)</label>
                        <input type="text" class="form-control" id="inputCidade" placeholder="ESCREVA AQUI">
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-4" style="margin-top: 1%;">
                        <label for="inputRua" class="form-label fw-bold">RUA</label>
                        <input type="text" class="form-control" id="inputRua" placeholder="ESCREVA AQUI">
                    </div>
                    <div class="col-md-3" style="margin-top: 1%;">
                        <label for="inputBairro" class="form-label fw-bold">BAIRRO</label>
                        <input type="text" class="form-control" id="inputBairro" placeholder="ESCREVA AQUI">
                    </div>
                    <div class="col-md-2" style="margin-top: 1%;">
                        <label for="inputNum" class="form-label fw-bold">Nº</label>
                        <input type="number" class="form-control" id="inputNum" placeholder="ESCREVA AQUI">
                    </div>
                    <div class="col-md-3" style="margin-top: 1%;">
                        <label for="inputComple" class="form-label fw-bold">COMPLEMENTO</label>
                        <input type="text" class="form-control" id="inputComple" placeholder="ESCREVA AQUI">
                    </div>
                </div>

                <div class="row justify-content-center mt-3">
                    <div class="col-md-6 text-center" style="margin-top: 1%;">
                        <label for="inputPreco" class="form-label fw-bold">PREÇO APROXIMADO POR PESSOA (R$)</label>
                        <input type="number" class="form-control" id="inputPreco" placeholder="ESCREVA AQUI">
                    </div>
                </div>

                <div class="text-center" style="margin-top: 2%;">
                <button id="button_enviar" class="btn btn-primary">CADASTRAR</button>
                </div>            
            </form>

        </div>
    </main>

    <footer>
        <div class="d-flex align-items-center">
            <div class="rodape">
                <i class="fa-solid fa-copyright"></i>
                <p style="margin: 0;">Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>
    
    <script>
        document.getElementById("button_comentar").addEventListener("click", function () {
            window.location.href = "detalhes.html";
        });

    </script>

</body>
</html>
