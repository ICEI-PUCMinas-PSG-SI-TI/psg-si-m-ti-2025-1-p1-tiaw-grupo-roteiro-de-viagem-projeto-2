<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>FAQ SmartTravel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="shortcut icon" type="imagex/png" href="assets/img/aviaoeseta.png">
    <link rel="stylesheet" href="assets/css/faq.css">
</head>

<body>
<!--cabeçalho-->
    <header class="d-flex cab position-relative cab container-fluid">

        <img src="assets/img/logoST.PNG" id="logo">
        <p class="position-absolute" id="iconworld">BRL <i class="fa-solid fa-earth-americas"></i></p>
        <p class="position-absolute py-1 px-3" id="nomelogin">LOGIN</p>
        <i class="fa-regular fa-user fa-2x position-absolute" id="iconuser"></i>

    </header>
<!--conteudo-->
    <div class="container py-5">
        <button id="button_voltar" class="btn btn-primary" onclick="history.back()">VOLTAR</button>
        <h2 class="text-center mb-5 mt-4 inicio">PERGUNTAS FREQUENTES</h2>
        <div class="row">
            <!-- Coluna de perguntas -->
            <div class="col-md-7">
                <div id="faqAccordion" class="accordion"></div>
                <div class="d-flex justify-content-center mt-4" id="paginacao"></div>

            </div>

            <!-- Coluna de envio -->
             <div class="col-md-5 text-center">
                <img src="assets/img/FAQ-imagem.png" alt="Question Illustration"
                    class="img-fluid mb-4" style="max-height: 220px;">
                <h4>Alguma dúvida?</h4>
                <p>Escreva suas perguntas aqui que em breve responderemos.</p>
                <a href="duvidas.html" class="btn enviar text-white rounded-pill w-50">DEIXE SUA DÚVIDA</a>
            </div>
        </div>
    </div>
    <footer>
        <div class="d-flex align-items-center">
            <div class="rodape">
                <i class="fa-solid fa-copyright"></i>
                <p style="margin: 0;">Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="assets/scripts/faq.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
