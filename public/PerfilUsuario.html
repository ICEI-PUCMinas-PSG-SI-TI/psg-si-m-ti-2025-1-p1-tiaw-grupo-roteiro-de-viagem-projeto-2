    <!-- MUDANÇAS!!!!!!!!! ALTERAR O CAMINHO DA IMAGEM -->

  <!--pagina de perfil-->

  <main>
    <!--imagem e nome-->
    <div class="container mt-5">
      <div class="text-center d-block justify-content-center mb-4">
        <div class="d-flex">
          <div class="avatar-container position-relative mx-auto mb-4">
            <img id="avatar" src="assets/img/default.png" class="rounded-circle" width="200" height="200">


            <!-- Botão que chama a função para pedir a URL da imagem -->
            <button onclick="mudarFotoPorURL()" class="botao-upload border-0 position-absolute"
              style="bottom: 10px; right: 10px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                class="bi bi-pencil-fill text-light" viewBox="0 0 16 16">
                <path
                  d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z" />
              </svg>
            </button>


          </div>
        </div>
        <h2 id="nome-usuario" class="mt-3"></h2>
      </div>
      <div id="alerta-customizado" class="alerta-oculto">URL da imagem atualizada com sucesso!</div>
    </div>




    <!--dados do usuario-->
    <form onsubmit="salvarAlteracoes(event)" class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <label for="login" class="form-label">Usuário</label>
        <input type="text" class="form-control" id="login">
      </div>


      <div class="mb-3">
        <label for="nomecompleto" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="nomecompleto">
      </div>


      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email">
      </div>


      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha">
        <div class="form-check mt-1">
          <input class="form-check-input" type="checkbox" id="mostrarSenha" onclick="toggleSenha()">
          <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
        </div>


        <button type="submit" class="mt-3 btn custom-buttom text-white">Salvar alterações</button>
      </div>
    </form>
    </div>
  </main>
  <!--rodapé-->
  <footer class="container-fluid" id="degrade">
    © Todos os direitos reservados.
  </footer>




  <!--senha check + scripts-->
  <script>
    function toggleSenha() {
      const input = document.getElementById("senha");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>
  <script>
    function sairConta() {
      // Verificar se existe um usuário logado
      const usuario = sessionStorage.getItem("usuarioCorrente");


      if (!usuario) {
        alert("Nenhum usuário está logado no momento.");
        return;
      }


      // Limpar o sessionStorage e variáveis
      sessionStorage.removeItem("usuarioCorrente");
      usuarioCorrente = null;


      // Limpar campos se existirem
      if (document.getElementById("login")) document.getElementById("login").value = "";
      if (document.getElementById("nomecompleto")) document.getElementById("nomecompleto").value = "";
      if (document.getElementById("email")) document.getElementById("email").value = "";
      if (document.getElementById("senha")) document.getElementById("senha").value = "";


      // Limpar textos e imagens do perfil, se existirem
      if (document.getElementById("nome-usuario")) document.getElementById("nome-usuario").textContent = "";
      if (document.getElementById("usuario-nome-topo")) document.getElementById("usuario-nome-topo").textContent = "";
      if (document.getElementById("avatar")) document.getElementById("avatar").src = "assets/img/imglogin.png";
      if (document.getElementById("avatar-topo")) document.getElementById("avatar-topo").src = "assets/img/imglogin.png";


      alert("Você saiu da conta.");
      window.location.href = "index.html";
    }


    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      menu.classList.toggle('open');
    }


    document.getElementById('darkModeToggle')?.addEventListener('change', function () {
      document.body.classList.toggle('dark-mode', this.checked);
    });


    const botaoSair = document.getElementById("sair_conta");
    if (botaoSair) {
      botaoSair.addEventListener("click", sairConta);
    }
  </script>
  <script src="assets/scripts/perfil.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
