    <!--dados do usuario-->
      <form onsubmit="salvarAlteracoes(event)" class="mx-auto" style="max-width: 500px;">
        <div class="mb-3">
          <label for="login" class="form-label">Usuário</label>
          <input type="text" class="form-control" id="login">
        </div>

        <div class="mb-3">
          <label for="nomecompleto" class="form-label">Nome Completo</label>
          <input type="text" class="form-control" id="nomecompleto">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email">
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha">
          <div class="form-check mt-1">
            <input class="form-check-input" type="checkbox" id="mostrarSenha" onclick="toggleSenha()">
            <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
          </div>

          <button type="submit" class="mt-3 btn custom-buttom text-white">Salvar alterações</button>
        </div>
      </form>
    </div>
  </main>
  <!--rodapé-->
  <footer class="container-fluid" id="degrade">
    © Todos os direitos reservados.
  </footer>


  <!--senha check + scripts-->
  <script>
    function toggleSenha() {
      const input = document.getElementById("senha");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>
  <script src="assets/scripts/perfil.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
